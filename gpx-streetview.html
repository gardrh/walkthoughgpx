<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Løypeforhåndsvisning</title>
<style>
:root{--bg:#10171c;--panel:#18222a;--line:#2a3944;--txt:#e8eef2;--mut:#8fa1ad;--acc:#4fb3e8}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 "Segoe UI","Helvetica Neue",Arial,sans-serif}
#app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr auto;height:100%}
header{grid-column:1/3;display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:600}
input,button,label.btn{font:inherit;color:var(--txt);background:#22303a;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button,label.btn{cursor:pointer}button:hover,label.btn:hover{border-color:var(--acc)}
#key{width:260px}
#pano{grid-column:1;grid-row:2;position:relative;min-height:0}
#panoEl{position:absolute;inset:0}
#side{grid-column:2;grid-row:2;display:flex;flex-direction:column;border-left:1px solid var(--line);min-height:0}
#map{flex:1;min-height:0}
#elev{width:100%;height:150px;display:block;border-top:1px solid var(--line);cursor:pointer;background:var(--panel)}
footer{grid-column:1/3;display:flex;gap:12px;align-items:center;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
#seek{flex:1;accent-color:var(--acc)}
#stat{min-width:230px;color:var(--mut);font-variant-numeric:tabular-nums}
#stat b{color:var(--txt)}
#msg{position:absolute;left:12px;top:12px;background:rgba(16,23,28,.85);padding:6px 10px;border-radius:8px;display:none}
#gate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);padding:24px}
@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr 200px auto}#side{grid-column:1;grid-row:3;flex-direction:row;border-left:0}#map{flex:1}#elev{width:50%;height:100%;border-top:0}header,footer{grid-column:1}#key{width:140px}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1 id="title">Løypeforhåndsvisning</h1>
  <input id="key" type="password" placeholder="Google Maps API-nøkkel" autocomplete="off">
  <button id="go">Last inn</button>
  <label class="btn">Velg GPX…<input id="file" type="file" accept=".gpx" hidden></label>
</header>
<div id="pano"><div id="panoEl"></div><div id="msg"></div><div id="gate">Lim inn API-nøkkelen din (Maps JavaScript API) og trykk «Last inn».<br>Løypa til Málaga Marathon er allerede lastet; du kan også velge en annen GPX-fil.</div></div>
<div id="side"><div id="map"></div><canvas id="elev"></canvas></div>
<footer>
  <button id="play" disabled>▶ Spill av</button>
  <input id="seek" type="range" min="0" max="0" value="0" disabled>
  <label>Fart <input id="speed" type="range" min="1" max="10" value="3" style="width:90px;accent-color:var(--acc)"></label>
  <label><input id="follow" type="checkbox" checked> Følg løypa</label>
  <div id="stat">–</div>
</footer>
</div>

let NAME="GENERALI Maratón Málaga 2025";

const $=id=>document.getElementById(id);
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
function dist(a,b){const x=rad(b[1]-a[1])*Math.cos(rad((a[0]+b[0])/2)),y=rad(b[0]-a[0]);return 6371000*Math.hypot(x,y)}
function bearing(a,b){const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0])),x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return (deg(Math.atan2(y,x))+360)%360}
function angdiff(a,b){return ((b-a+540)%360)-180}

function resample(raw){
  const out=[raw[0].slice()];let carry=0;
  for(let i=1;i<raw.length;i++){
    let a=raw[i-1],b=raw[i],seg=dist(a,b);if(!seg)continue;
    let pos=STEP-carry;
    while(pos<=seg){const t=pos/seg;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]);pos+=STEP}
    carry=seg-(pos-STEP);
  }
  return out;
}
function parseGPX(txt){
  const x=new DOMParser().parseFromString(txt,"application/xml");
  let pts=[...x.getElementsByTagName("trkpt")];if(!pts.length)pts=[...x.getElementsByTagName("rtept")];
  const nm=x.getElementsByTagName("name")[0];
  return {name:nm?nm.textContent.trim():"GPX",pts:pts.map(p=>[+p.getAttribute("lat"),+p.getAttribute("lon"),+(p.getElementsByTagName("ele")[0]?.textContent||0)])};
}

let pts=[],cum=[],panos=[],idx=0,playing=false,heading=0,map,marker,pano,svc,timer=null,busy=false,missed=0;

function prepare(){
  pts=resample(ROUTE);cum=[0];for(let i=1;i<pts.length;i++)cum[i]=cum[i-1]+dist(pts[i-1],pts[i]);
  panos=new Array(pts.length).fill(null);idx=0;missed=0;
  $("title").textContent=NAME;
  $("seek").max=pts.length-1;$("seek").value=0;
  drawElev();
}
function ensure(i){
  if(i<0||i>=pts.length)return Promise.resolve(null);
  if(!panos[i])panos[i]=new Promise(res=>{
    svc.getPanorama({location:{lat:pts[i][0],lng:pts[i][1]},radius:25,source:google.maps.StreetViewSource.OUTDOOR,preference:google.maps.StreetViewPreference.NEAREST},(d,st)=>{
      res(st==="OK"?{id:d.location.pano,date:d.imageDate||""}:{id:null})});
  });
  return panos[i];
}
async function show(i){
  idx=Math.max(0,Math.min(pts.length-1,i));$("seek").value=idx;
  for(let k=1;k<=PREFETCH;k++)ensure(idx+k);
  const p=await ensure(idx);
  if(p&&p.id){ $("msg").style.display="none"; if(pano.getPano()!==p.id)pano.setPano(p.id); }
  else { missed++; $("msg").textContent="Ingen Street View-dekning her";$("msg").style.display="block"; }
  if($("follow").checked){
    const target=bearing(pts[idx],pts[Math.min(idx+4,pts.length-1)]);
    heading=(heading+angdiff(heading,target)*0.35+360)%360;
    pano.setPov({heading,pitch:0});
  }
  marker.setPosition({lat:pts[idx][0],lng:pts[idx][1]});
  if(!map.getBounds()||!map.getBounds().contains(marker.getPosition()))map.panTo(marker.getPosition());
  $("stat").innerHTML=`<b>${(cum[idx]/1000).toFixed(1)}</b> / ${(cum[cum.length-1]/1000).toFixed(1)} km · ${Math.round(pts[idx][2])} moh`+(p&&p.date?` · bilde ${p.date}`:"");
  drawElev();
}
function tick(){
  if(!playing)return;
  if(idx>=pts.length-1){toggle(false);return}
  if(busy)return;busy=true;
  show(idx+1).finally(()=>{busy=false});
}
function schedule(){clearInterval(timer);timer=setInterval(tick,1000/(+$("speed").value))}
function toggle(on){
  playing=on===undefined?!playing:on;
  $("play").textContent=playing?"⏸ Pause":"▶ Spill av";
  if(playing)schedule();else clearInterval(timer);
}

function drawElev(){
  const c=$("elev"),r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;
  c.width=r.width*dpr;c.height=r.height*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);
  const W=r.width,H=r.height,pad=8;if(!pts.length)return;
  const e=pts.map((p,i)=>{let s=0,n=0;for(let k=Math.max(0,i-6);k<=Math.min(pts.length-1,i+6);k++){s+=pts[k][2];n++}return s/n});
  const lo=Math.min(...e)-2,hi=Math.max(...e,lo+30)+2,tot=cum[cum.length-1];
  const X=d=>pad+(W-2*pad)*d/tot,Y=v=>H-pad-(H-2*pad)*(v-lo)/(hi-lo);
  g.beginPath();g.moveTo(X(0),H-pad);e.forEach((v,i)=>g.lineTo(X(cum[i]),Y(v)));g.lineTo(X(tot),H-pad);g.closePath();
  g.fillStyle="rgba(79,179,232,.25)";g.fill();
  g.beginPath();e.forEach((v,i)=>i?g.lineTo(X(cum[i]),Y(v)):g.moveTo(X(cum[i]),Y(v)));g.strokeStyle="#4fb3e8";g.lineWidth=1.5;g.stroke();
  g.fillStyle="#8fa1ad";g.font="11px sans-serif";g.fillText(Math.round(hi)+" m",pad,12);g.fillText(Math.round(lo)+" m",pad,H-pad-2);
  const x=X(cum[idx]);g.strokeStyle="#fff";g.lineWidth=1.5;g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();
}

function initMaps(){
  svc=new google.maps.StreetViewService();
  map=new google.maps.Map($("map"),{mapTypeId:"roadmap",disableDefaultUI:true,zoomControl:true,gestureHandling:"greedy"});
  pano=new google.maps.StreetViewPanorama($("panoEl"),{visible:true,addressControl:false,motionTracking:false,fullscreenControl:true});
  marker=new google.maps.Marker({map,icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:"#ff5a3c",fillOpacity:1,strokeColor:"#fff",strokeWeight:2}});
  loadRoute();
  $("gate").style.display="none";$("play").disabled=false;$("seek").disabled=false;
}
let poly;
function loadRoute(){
  prepare();
  if(poly)poly.setMap(null);
  poly=new google.maps.Polyline({map,path:ROUTE.map(p=>({lat:p[0],lng:p[1]})),strokeColor:"#4fb3e8",strokeWeight:4});
  const b=new google.maps.LatLngBounds();ROUTE.forEach(p=>b.extend({lat:p[0],lng:p[1]}));map.fitBounds(b);
  show(0);
}
function loadMaps(key){
  if(window.google&&google.maps){return}
  localStorage.setItem("gmk",key);
  const s=document.createElement("script");
  s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=initMaps`;
  s.onerror=()=>alert("Kunne ikke laste Google Maps. Sjekk API-nøkkelen.");
  document.head.appendChild(s);
}
window.initMaps=initMaps;

$("go").onclick=()=>{const k=$("key").value.trim();if(k)loadMaps(k)};
$("key").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
try{const k=localStorage.getItem("gmk");if(k)$("key").value=k}catch(e){}
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const r=parseGPX(await f.text());
  if(r.pts.length<2){alert("Fant ingen trackpunkter i filen");return}
  ROUTE=r.pts;NAME=r.name;toggle(false);if(map)loadRoute();else prepare();
};
$("play").onclick=()=>toggle();
$("seek").oninput=e=>{show(+e.target.value)};
$("speed").oninput=()=>{if(playing)schedule()};
$("elev").onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),f=(e.clientX-r.left-8)/(r.width-16),t=Math.max(0,Math.min(1,f))*cum[cum.length-1];let i=cum.findIndex(v=>v>=t);show(i<0?pts.length-1:i)};
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"&&e.target.type!=="range")return;
  if(e.code==="Space"){e.preventDefault();toggle()}
  if(e.code==="ArrowRight")show(idx+(e.shiftKey?20:3));
  if(e.code==="ArrowLeft")show(idx-(e.shiftKey?20:3));});
addEventListener("resize",drawElev);
</script>
